name: Sherpa Reader Windows

on:
  push:
    branches: [feature/sherpa-reader-windows]
    paths:
      - 'sherpa-reader-windows/**'
      - '.github/workflows/sherpa-reader-windows.yml'
  pull_request:
    paths:
      - 'sherpa-reader-windows/**'
      - '.github/workflows/sherpa-reader-windows.yml'
  workflow_dispatch:

jobs:
  windows-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: sherpa-reader-windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile Python sources
        run: python -m compileall -q app tests
      - name: Run tests
        run: pytest -q
      - name: Package Windows application
        run: pyinstaller --noconfirm --clean --windowed --name SherpaReader --collect-all sherpa_onnx --collect-all soundfile app/main.py
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SherpaReader-Windows-x64
          path: sherpa-reader-windows/dist/SherpaReader/
          if-no-files-found: error
